<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delira - Gestão de Lava-Rápido</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Delira<span>.</span> Carwash</h1>
      <p class="subtitle">Entre para gerenciar seu lava-rápido</p>
      <form id="login-form">
        <div class="field">
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">Entrar</button>
        <p class="error-msg" id="login-error"></p>
      </form>
      <div class="hint-box">
        Primeiro acesso? Use o usuário administrador padrão criado no servidor
        (ver console/README) e troque a senha em Configurações.
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">Delira<span>.</span></div>
      <button class="nav-item" data-page="dashboard">📊 Dashboard</button>
      <button class="nav-item" data-page="atendimentos">🚗 Atendimentos</button>
      <button class="nav-item" data-page="despesas">💸 Despesas</button>
      <button class="nav-item" data-page="servicos">🧽 Serviços</button>
      <div class="sidebar-footer">
        <div class="user-name" id="sidebar-user"></div>
        <button id="change-password-btn" type="button">Trocar senha</button><br/>
        <button id="logout-btn" type="button">Sair</button>
      </div>
    </aside>
    <main class="main" id="main-content"></main>
  </div>

  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/atendimentos.js"></script>
  <script src="js/views/despesas.js"></script>
  <script src="js/views/servicos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
